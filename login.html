<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Textile AI — Login</title>
  <meta name="description" content="Secure access to the Textile AI Industrial Dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --clr-bg: #f0f4f8;
      --clr-card: #ffffff;
      --clr-border: rgba(0,0,0,0.08);
      --clr-accent: #3b82f6;
      --clr-accent2: #6366f1;
      --clr-text: #0f172a;
      --clr-muted: #64748b;
      --clr-error: #ef4444;
    }
    html, body {
      height: 100%;
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      background: var(--clr-bg);
      color: var(--clr-text);
      overflow: hidden;
    }
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      pointer-events: none;
      animation: blobFloat 14s ease-in-out infinite alternate;
    }
    .blob-1 { width: 520px; height: 520px; background: #93c5fd; top: -120px; left: -100px; animation-duration: 16s; }
    .blob-2 { width: 400px; height: 400px; background: #a5b4fc; bottom: -80px; right: -60px; animation-duration: 12s; animation-delay: -5s; }
    .blob-3 { width: 260px; height: 260px; background: #7dd3fc; top: 50%; left: 55%; animation-duration: 19s; animation-delay: -9s; }
    @keyframes blobFloat {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, -40px) scale(1.08); }
    }
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .login-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 20px;
      padding: 44px 40px 40px;
      box-shadow:
        0 4px 6px -1px rgba(0,0,0,0.04),
        0 20px 60px -12px rgba(0,0,0,0.12),
        0 0 0 1px rgba(0,0,0,0.03) inset;
      animation: cardIn 0.55s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-heading {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 6px;
      color: #0f172a;
    }
    .login-subheading {
      font-size: 0.85rem;
      color: var(--clr-muted);
      margin-bottom: 30px;
      font-weight: 400;
    }
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      display: flex;
      align-items: center;
      pointer-events: none;
      color: #94a3b8;
      transition: color 0.2s;
    }
    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 14px 0 42px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      color: #0f172a;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .form-input::placeholder { color: #cbd5e1; }
    .form-input:focus {
      border-color: var(--clr-accent);
      background: #eff6ff;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }
    .toggle-pw {
      position: absolute;
      right: 13px;
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }
    .toggle-pw:hover { color: #475569; background: rgba(0,0,0,0.04); }
    .error-msg {
      display: none;
      align-items: center;
      gap: 7px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #dc2626;
      font-weight: 500;
      margin-bottom: 18px;
      animation: shake 0.35s ease;
    }
    .error-msg.visible { display: flex; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      60%      { transform: translateX(6px); }
      80%      { transform: translateX(-3px); }
    }
    .btn-login {
      width: 100%;
      height: 50px;
      margin-top: 6px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: #fff;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(99,102,241,0.28);
      transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
      position: relative;
      overflow: hidden;
    }
    .btn-login::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
      border-radius: inherit;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(99,102,241,0.38); }
    .btn-login:active { transform: translateY(0); box-shadow: 0 4px 12px rgba(99,102,241,0.22); }
    .btn-login.loading { pointer-events: none; filter: brightness(0.88); }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-demo {
      width: 100%;
      height: 46px;
      margin-top: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #ffffff;
      color: #475569;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.18s, border-color 0.18s, color 0.18s, box-shadow 0.18s;
    }
    .btn-demo:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #1e293b;
      box-shadow: 0 4px 14px rgba(15,23,42,0.06);
    }
    .btn-demo:active { background: #f1f5f9; }
    .btn-demo.loading { pointer-events: none; opacity: 0.65; }
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 0.72rem;
      color: #94a3b8;
    }
    .login-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.72rem;
      color: #94a3b8;
    }

    /* Login page logo */
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .login-logo-img {
      height: 130px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="grid-overlay"></div>

  <div class="login-wrapper">
    <div class="login-card" role="main">

      <div class="login-logo">
        <img src="logo.png" alt="Lucky Textile Mills Limited" class="login-logo-img" />
      </div>

      <h1 class="login-heading">Welcome back</h1>
      <p class="login-subheading">Sign in to access the operations centre.</p>

      <div class="error-msg" id="errorMsg" role="alert" aria-live="polite">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Invalid username or password. Please try again.
      </div>

      <form id="loginForm" autocomplete="off" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input id="username" class="form-input" type="text" placeholder="Enter username" autocomplete="username" spellcheck="false" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="password" class="form-input" type="password" placeholder="Enter password" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn-login" type="submit" id="loginBtn">
          <div class="spinner"></div>
          <span class="btn-text">Sign In</span>
        </button>

        <button class="btn-demo" type="button" id="demoLoginBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          Continue with demo access
        </button>
      </form>

      <div class="security-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Secured &middot; Industrial Access Portal
      </div>
    </div>

    <div class="login-footer">&copy; 2026 Spark Technologies &mdash; All rights reserved</div>
  </div>

  <script>
    (function () {
      if (sessionStorage.getItem('textile_auth') === 'authenticated') {
        window.location.replace('index.html');
        return;
      }

      var VALID_USER = 'admin';
      var VALID_PASS = 'admin';

      var form     = document.getElementById('loginForm');
      var userEl   = document.getElementById('username');
      var passEl   = document.getElementById('password');
      var errorEl  = document.getElementById('errorMsg');
      var btn      = document.getElementById('loginBtn');
      var demoBtn  = document.getElementById('demoLoginBtn');
      var togglePw = document.getElementById('togglePw');
      var eyeIcon  = document.getElementById('eyeIcon');

      togglePw.addEventListener('click', function () {
        var isHidden = passEl.type === 'password';
        passEl.type = isHidden ? 'text' : 'password';
        eyeIcon.innerHTML = isHidden
          ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var u = userEl.value.trim();
        var p = passEl.value;
        errorEl.classList.remove('visible');
        btn.classList.add('loading');
        setTimeout(function () {
          if (u === VALID_USER && p === VALID_PASS) {
            sessionStorage.setItem('textile_auth', 'authenticated');
            window.location.replace('index.html');
          } else {
            btn.classList.remove('loading');
            errorEl.classList.add('visible');
            passEl.value = '';
            passEl.focus();
          }
        }, 620);
      });

      demoBtn.addEventListener('click', function () {
        errorEl.classList.remove('visible');
        demoBtn.classList.add('loading');
        sessionStorage.setItem('textile_auth', 'authenticated');
        window.location.replace('index.html');
      });

      [userEl, passEl].forEach(function (el) {
        el.addEventListener('input', function () {
          errorEl.classList.remove('visible');
        });
      });

      userEl.focus();
    })();
  </script>
</body>
</html>
